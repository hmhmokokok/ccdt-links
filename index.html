<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="CCDT — official links for Committed Communities Development Trust" />
    <meta name="theme-color" content="#1a5c45" />
    <title>CCDT Official</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700&display=swap"

    />
    <link rel="stylesheet" href="css/styles.css" />
    <link rel="icon" href="assets/avatar.svg" type="image/svg+xml" />

  <body>
    <div class="atmosphere" aria-hidden="true"></div>

    <main class="shell">

        <p class="bio" id="bio"></p>

      <nav class="links" id="links" aria-label="Official links"></nav>

      <p class="footer" id="footer"></p>

      <p class="qr-link">
        <a href="/qr">Download QR code</a>
      </p>
    </main>

    <script src="js/app.js" type="module"></script>

</html>
